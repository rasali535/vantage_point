name: Hostinger static frontend deployment

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: hostinger-frontend-deploy
  cancel-in-progress: false

jobs:
  build-and-deploy:
    name: Build Vite frontend and deploy to Hostinger
    runs-on: ubuntu-latest
    env:
      VITE_API_URL: https://vantage-point-1qv7.onrender.com
      HOSTINGER_SFTP_HOST: ${{ secrets.HOSTINGER_SFTP_HOST }}
      HOSTINGER_SFTP_USERNAME: ${{ secrets.HOSTINGER_SFTP_USERNAME }}
      HOSTINGER_SFTP_PRIVATE_KEY: ${{ secrets.HOSTINGER_SFTP_PRIVATE_KEY }}
      HOSTINGER_SFTP_REMOTE_PATH: ${{ secrets.HOSTINGER_SFTP_REMOTE_PATH }}
    steps:
      - name: Check out repository
        uses: actions/checkout@v5

      - name: Set up Node.js
        uses: actions/setup-node@v5
        with:
          node-version: "24"
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install frontend dependencies
        working-directory: frontend
        run: npm ci

      - name: Build production frontend
        working-directory: frontend
        run: npm run build

      - name: Verify deployable output
        run: |
          test -s frontend/dist/index.html
          test -d frontend/dist/assets
          echo "Vite production output verified."

      - name: Deploy frontend to Hostinger over SFTP
        if: ${{ env.HOSTINGER_SFTP_HOST != '' && env.HOSTINGER_SFTP_USERNAME != '' && env.HOSTINGER_SFTP_PRIVATE_KEY != '' && env.HOSTINGER_SFTP_REMOTE_PATH != '' }}
        uses: wlixcc/SFTP-Deploy-Action@v1.2.6
        with:
          server: ${{ env.HOSTINGER_SFTP_HOST }}
          port: 65002
          username: ${{ env.HOSTINGER_SFTP_USERNAME }}
          ssh_private_key: ${{ env.HOSTINGER_SFTP_PRIVATE_KEY }}
          local_path: ./frontend/dist/*
          remote_path: ${{ env.HOSTINGER_SFTP_REMOTE_PATH }}
          sftp_only: true
          delete_remote_files: false
          sftpArgs: -o ConnectTimeout=20

      - name: Explain skipped deployment
        if: ${{ env.HOSTINGER_SFTP_HOST == '' || env.HOSTINGER_SFTP_USERNAME == '' || env.HOSTINGER_SFTP_PRIVATE_KEY == '' || env.HOSTINGER_SFTP_REMOTE_PATH == '' }}
        run: |
          echo "::notice::Frontend build passed, but Hostinger deployment was skipped because one or more HOSTINGER_SFTP_* GitHub Actions secrets are not configured."
